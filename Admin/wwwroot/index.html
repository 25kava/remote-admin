<!doctype html>
<html><head><meta charset="utf-8"><title>Remote Admin</title><style>
body{margin:0;background:#111827;color:#e5e7eb;font:14px Segoe UI, sans-serif}header{padding:18px 24px;background:#1f2937;display:flex;justify-content:space-between}main{display:flex;height:calc(100vh - 65px)}aside{width:280px;padding:18px;background:#0f172a;border-right:1px solid #374151}section{padding:20px;flex:1;overflow:auto}.device{padding:12px;margin:8px 0;background:#1f2937;border-radius:6px;cursor:pointer}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:8px}.connected .dot{background:#22c55e}button{background:#2563eb;border:0;color:white;padding:9px 12px;border-radius:5px;cursor:pointer;margin:4px}input,textarea{background:#0b1220;color:#e5e7eb;border:1px solid #4b5563;padding:8px;border-radius:4px}#terminal{background:#020617;color:#d1fae5;height:320px;overflow:auto;padding:12px;white-space:pre-wrap;font-family:Consolas,monospace}.panel{background:#1f2937;padding:15px;border-radius:8px;margin-bottom:15px}.muted{color:#9ca3af}
button:disabled{opacity:.45;cursor:default}.screenHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.screenHeader h3{margin:0}.screenViewport{margin-top:12px;min-height:220px;background:#020617;border:1px solid #374151;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}.screenViewport img{display:block;max-width:100%;max-height:80vh;object-fit:contain}.screenViewport:fullscreen img{max-height:100vh}.screenPlaceholder{padding:32px;text-align:center}[hidden]{display:none!important}
</style></head><body><div id="app"><header><b>Remote Admin</b><span class="muted">Open LAN prototype</span></header><main><aside><h3>Devices</h3><div id="devices"></div></aside><section id="content"><p class="muted">Waiting for clients...</p></section></main></div>
<script src="/screen.js"></script>
<script>
let selected=null, socket=null, terminalSessionId=null;
async function load(){let r=await fetch('/api/devices');let ds=await r.json();if(selected)ScreenView.deviceChanged(ds.find(x=>x.deviceId===selected));devices.innerHTML=ds.map(d=>`<div class="device ${d.status.toLowerCase()}" onclick="selectDevice('${d.deviceId}')"><span class="dot"></span><b>${esc(d.displayName)}</b><br><span class="muted">${d.status}</span></div>`).join('')}
async function selectDevice(id){ScreenView.stop();selected=id;terminalSessionId=null;let ds=await (await fetch('/api/devices')).json(),d=ds.find(x=>x.deviceId===id);if(selected!==id||!d)return;content.innerHTML=`<h2>${esc(d.displayName)}</h2><div class="panel"><b>Connection:</b> ${d.status}<br><b>Windows:</b> ${d.stats?.windowsVersion||'Waiting for statistics'}<br><b>IP:</b> ${d.ipAddress||''}<br><b>CPU:</b> ${d.stats?.cpuPercent?.toFixed(1)||'-'}% <b>RAM:</b> ${d.stats?.memoryPercent?.toFixed(1)||'-'}%</div><div class="panel"><h3>Remote terminal (CMD)</h3><div id="terminal"></div><button onclick="clearTerminal()">Clear terminal</button><input id="cmd" placeholder="CMD input" onkeydown="if(event.key==='Enter')sendCmd()"><button onclick="sendCmd()">Send</button></div><div class="panel"><h3>System notes</h3><textarea id="notes" rows="6" style="width:100%" placeholder="Notes about this system"></textarea><br><button onclick="saveNotes()">Save notes</button></div><div class="panel"><h3>Session</h3><button onclick="send({type:'controlStart'})">Remote control</button><button onclick="send({type:'controlStop'})">Stop control</button><p class="muted">Secure desktop, UAC, lock-screen, and system-level shortcuts are unavailable to a standard-user client.</p></div>`;ScreenView.mount(content,!!d.screenStreamingSupported,send);openSocket()}
function openSocket(){if(socket)socket.close();socket=new WebSocket(`ws://${location.host}/ws/${selected}`);const activeSocket=socket;socket.onopen=()=>{if(socket!==activeSocket)return;ScreenView.connectionChanged(true);send({type:'terminalRestart'});send({type:'notesGet'})};socket.onmessage=e=>{if(socket!==activeSocket)return;let m=JSON.parse(e.data);if(ScreenView.handle(m))return;if(m.type==='terminalStarted'){terminalSessionId=m.payload.sessionId;terminal.textContent+=`[CMD session active in ${m.payload.workingDirectory}]\n`}else if(m.type==='terminalOutput'){if(!terminalSessionId)terminalSessionId=m.payload.sessionId;if(m.payload.sessionId===terminalSessionId)terminal.textContent+=m.payload.data;if(m.payload.isExited)terminal.textContent+=`\n[CMD exited with code ${m.payload.exitCode}]\n`}else if(m.type==='notesState'){notes.value=m.payload.text||''}else if(m.type==='requestError'){terminal.textContent+=`\n[Error] ${m.error}\n`}else if(m.type==='stats')load()};socket.onclose=()=>{if(socket!==activeSocket)return;ScreenView.connectionChanged(false);if(selected)terminal.textContent+='\n[Connection closed]\n'}}
function send(x){if(socket?.readyState===1)socket.send(JSON.stringify(x))}
function sendCmd(){let v=cmd.value;if(v){send({type:'terminalInput',payload:{sessionId:terminalSessionId,data:v+'\n'}});cmd.value=''}}
function clearTerminal(){terminal.textContent=''}
function saveNotes(){send({type:'notesSet',payload:{text:notes.value}})}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
load();setInterval(load,500);
</script></body></html>
