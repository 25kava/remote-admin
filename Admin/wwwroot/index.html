<!doctype html>
<html><head><meta charset="utf-8"><title>Remote Admin</title><style>
body{margin:0;background:#111827;color:#e5e7eb;font:14px Segoe UI, sans-serif}header{padding:18px 24px;background:#1f2937;display:flex;justify-content:space-between}main{display:flex;height:calc(100vh - 65px)}aside{width:280px;padding:18px;background:#0f172a;border-right:1px solid #374151}section{padding:20px;flex:1;overflow:auto}.device{padding:12px;margin:8px 0;background:#1f2937;border-radius:6px;cursor:pointer}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:8px}.connected .dot{background:#22c55e}button{background:#2563eb;border:0;color:white;padding:9px 12px;border-radius:5px;cursor:pointer;margin:4px}input,textarea{background:#0b1220;color:#e5e7eb;border:1px solid #4b5563;padding:8px;border-radius:4px}#terminal{background:#020617;color:#d1fae5;height:320px;overflow:auto;padding:12px;white-space:pre-wrap;font-family:Consolas,monospace}.panel{background:#1f2937;padding:15px;border-radius:8px;margin-bottom:15px}.muted{color:#9ca3af}
</style></head><body><div id="login" style="position:fixed;inset:0;background:#111827;display:grid;place-items:center"><form onsubmit="return signIn(event)" class="panel"><h2>Administrator login</h2><input id="user" placeholder="Username" required><br><br><input id="pass" type="password" placeholder="Password" required><br><br><button>Sign in</button><span id="loginError"></span></form></div><div id="app" style="display:none"><header><b>Remote Admin</b><span id="who"></span></header><main><aside><h3>Devices</h3><div id="devices"></div></aside><section id="content"><p class="muted">Select a device.</p></section></main></div>
<script>
let selected=null, socket=null;
async function signIn(e){e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userName:user.value,password:pass.value})});if(!r.ok){loginError.textContent=' Invalid credentials';return false}login.style.display='none';app.style.display='block';load();return false}
async function load(){let r=await fetch('/api/devices');let ds=await r.json();devices.innerHTML=ds.map(d=>`<div class="device ${d.status.toLowerCase()}" onclick="selectDevice('${d.deviceId}')"><span class="dot"></span><b>${esc(d.displayName)}</b><br><span class="muted">${d.status}</span></div>`).join('')}
async function selectDevice(id){selected=id;let ds=await (await fetch('/api/devices')).json(),d=ds.find(x=>x.deviceId===id);content.innerHTML=`<h2>${esc(d.displayName)}</h2><div class="panel"><b>Connection:</b> ${d.status}<br><b>Windows:</b> ${d.stats?.windowsVersion||'Waiting for statistics'}<br><b>IP:</b> ${d.ipAddress||''}<br><b>CPU:</b> ${d.stats?.cpuPercent?.toFixed(1)||'-'}% <b>RAM:</b> ${d.stats?.memoryPercent?.toFixed(1)||'-'}%</div><div class="panel"><h3>Remote terminal</h3><div id="terminal"></div><button onclick="send({type:'terminalStart',payload:{shell:'powershell'}})">Start PowerShell</button><input id="cmd" placeholder="PowerShell command" onkeydown="if(event.key==='Enter')sendCmd()"><button onclick="sendCmd()">Send</button></div><div class="panel"><h3>Session</h3><button onclick="send({type:'screenStart'})">View screen</button><button onclick="send({type:'controlStart'})">Remote control</button><button onclick="send({type:'controlStop'})">Stop control</button><p class="muted">Secure desktop, UAC, lock-screen, and system-level shortcuts are unavailable to a standard-user client.</p></div>`;openSocket()}
function openSocket(){if(socket)socket.close();socket=new WebSocket(`ws://${location.host}/ws/${selected}`);socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='terminalOutput')terminal.textContent+=m.payload.data;else if(m.type==='stats')load()}}
function send(x){if(socket?.readyState===1)socket.send(JSON.stringify(x))}
function sendCmd(){let v=cmd.value;if(v){send({type:'terminalInput',payload:{data:v+'\\n'}});cmd.value=''}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></body></html>
